<!doctype html><html lang="cs"><head><meta charset="utf-8">
<style>
@font-face{font-family:Bricolage;src:url(bricolage-grotesque-var.woff2) format("woff2");font-weight:200 800;font-display:block}
@font-face{font-family:Instrument;src:url(instrument-sans-var.woff2) format("woff2");font-weight:400 700;font-display:block}
@font-face{font-family:PlexMono;src:url(ibm-plex-mono-400.woff2) format("woff2");font-weight:400;font-display:block}
:root{--ink:#101321;--ink-2:#181C2E;--line:#2C3350;--inv:#F1F2F6;--mute:#9AA0B4;--accent:#1D2BE8;--lilac:#8A96FF;--bg:#ECEFF3}
*{box-sizing:border-box;margin:0}
html,body{width:1200px;height:630px;overflow:hidden}
body{background:var(--ink);color:var(--inv);font-family:Instrument,sans-serif;display:flex;flex-direction:column;position:relative}
.glow{position:absolute;width:820px;height:820px;right:-260px;top:-320px;border-radius:50%;
  background:radial-gradient(circle at 50% 50%, rgba(138,150,255,.30) 0%, rgba(29,43,232,.16) 42%, rgba(16,19,33,0) 68%)}
.rings{position:absolute;right:-160px;bottom:-220px;width:640px;height:640px;border-radius:50%;
  border:1px solid rgba(138,150,255,.16);box-shadow:0 0 0 60px rgba(138,150,255,.05), 0 0 0 130px rgba(138,150,255,.035)}
.in{position:relative;z-index:2;padding:72px 80px;display:flex;flex-direction:column;height:100%}
.brand{display:flex;align-items:center;gap:14px}
.brand svg{width:34px;height:34px}
.brand b{font-family:Bricolage;font-weight:600;font-size:24px;letter-spacing:-.01em;color:var(--inv);font-variation-settings:"opsz" 24}
h1{font-family:Bricolage;font-weight:300;font-variation-settings:"opsz" 96;letter-spacing:-.035em;line-height:.94;margin-top:auto;max-width:17ch}
p.sub{margin-top:26px;font-size:26px;line-height:1.4;color:var(--mute);max-width:34ch}
.foot{margin-top:auto;padding-top:34px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:baseline;gap:24px}
.foot .url{font-family:PlexMono;font-size:16px;letter-spacing:.1em;text-transform:uppercase;color:var(--lilac)}
.foot .cl{font-family:PlexMono;font-size:15px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.accent{color:var(--lilac)}
/* varianta klient */
body.klient h1{font-size:104px}
body.home h1{font-size:96px}
</style></head>
<body class="home">
<div class="glow"></div><div class="rings"></div>
<div class="in">
  <div class="brand">
    <svg viewBox="0 0 32 32" aria-hidden="true"><path fill="#8A96FF" d="M4 4h9v24H4zM19 4l9 24h-9z"/></svg>
    <b>Webkit.Studio</b>
  </div>
  <h1 id="h">Ptáme se.<br>Navrhujeme.<br>Stavíme.</h1>
  <p class="sub" id="s">Vedení digitálních projektů, weby a aplikace pro firmy.</p>
  <div class="foot">
    <span class="url" id="u">webkit.studio</span>
    <span class="cl" id="c">Návrh do dvou týdnů · Spuštění do osmi</span>
  </div>
</div>
</body></html>
