<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="color-scheme" content="light">
<meta name="supported-color-schemes" content="light">
<title>Nová poptávka z webu</title>
<!--
  Šablona notifikace o nové poptávce z webkit.studio.
  Posílá ji Make.com, ne Webflow — Webflow vlastní HTML do notifikace nepustí.

  Zástupné texty (v Make je nahraď hodnotami z modulu Webflow):
    {{firma}}   {{jmeno}}   {{email}}   {{zprava}}
    {{cas}}     {{stranka}} {{utm}}
  Když UTM nejsou, celý řádek v Make podmiň, ať tam nezůstane prázdno.

  Psáno tabulkami a inline styly schválně: Outlook neumí flex ani grid
  a vlastní vlastnosti (--barva) zahazuje.
-->
</head>
<body style="margin:0;padding:0;background-color:#ECEFF3;">
<div style="display:none;max-height:0;overflow:hidden;opacity:0;">{{jmeno}} z {{firma}}: {{zprava}}</div>

<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ECEFF3;">
<tr>
<td align="center" style="padding:24px 12px;">

  <table role="presentation" width="600" cellpadding="0" cellspacing="0" border="0" style="width:600px;max-width:100%;background-color:#FFFFFF;border-radius:16px;overflow:hidden;box-shadow:0 20px 40px -30px rgba(16,19,33,.35);">

    <!-- hlavička -->
    <tr>
      <td style="background-color:#101321;padding:22px 28px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="font-family:Georgia,'Times New Roman',serif;font-size:17px;font-weight:700;color:#FFFFFF;letter-spacing:-0.01em;">
              Webkit.Studio
            </td>
            <td align="right" style="font-family:'IBM Plex Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:#8A96FF;">
              Nová poptávka
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- kdo píše -->
    <tr>
      <td style="padding:28px 28px 8px;">
        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:24px;line-height:1.25;font-weight:600;color:#101321;">
          {{firma}}
        </div>
        <div style="font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;line-height:1.5;color:#646A7E;padding-top:4px;">
          {{jmeno}} &middot; <a href="mailto:{{email}}" style="color:#1D2BE8;text-decoration:none;">{{email}}</a>
        </div>
      </td>
    </tr>

    <!-- zprava -->
    <tr>
      <td style="padding:18px 28px 0;">
        <div style="font-family:'IBM Plex Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:0.09em;text-transform:uppercase;color:#646A7E;padding-bottom:8px;">
          Co řeší
        </div>
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#F7F8FA;border-radius:12px;border-left:3px solid #1D2BE8;">
          <tr>
            <td style="padding:16px 18px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:16px;line-height:1.6;color:#101321;white-space:pre-wrap;">{{zprava}}</td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- tlacitko -->
    <tr>
      <td style="padding:22px 28px 4px;">
        <table role="presentation" cellpadding="0" cellspacing="0" border="0">
          <tr>
            <td style="background-color:#1D2BE8;border-radius:10px;">
              <a href="mailto:{{email}}?subject=Re%3A%20va%C5%A1e%20popt%C3%A1vka%20z%20webkit.studio"
                 style="display:inline-block;padding:13px 22px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Arial,sans-serif;font-size:15px;font-weight:600;color:#FFFFFF;text-decoration:none;">
                Odpovědět na poptávku
              </a>
            </td>
          </tr>
        </table>
      </td>
    </tr>

    <!-- kontext -->
    <tr>
      <td style="padding:22px 28px 26px;">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="border-top:1px solid #E2E6EC;">
          <tr>
            <td style="padding-top:14px;font-family:'IBM Plex Mono',Consolas,Menlo,monospace;font-size:12px;line-height:1.9;color:#646A7E;">
              Odesláno &nbsp;<span style="color:#101321;">{{cas}}</span><br>
              Ze stránky &nbsp;<span style="color:#101321;">{{stranka}}</span><br>
              Kampaň &nbsp;<span style="color:#101321;">{{utm}}</span>
            </td>
          </tr>
        </table>
      </td>
    </tr>

  </table>

  <div style="font-family:'IBM Plex Mono',Consolas,Menlo,monospace;font-size:11px;letter-spacing:0.04em;color:#8A90A2;padding-top:14px;">
    webkit.studio &middot; IČO 09296778
  </div>

</td>
</tr>
</table>
</body>
</html>
